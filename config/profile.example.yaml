# Answers are nested by job ID. Inside that job, use
# "form_hash :: field_key :: exact prompt" -> answer you personally reviewed.
# Copy all values from `inspect`; cross-job, old-form, prompt-only, and fuzzy
# reuse are unsupported.
# This is the only way to resolve required legal, consent, salary, citizenship,
# criminal-history, export-control, clearance, signature, or custom questions.
# Copy the prompt exactly from `inspect`, verify the answer, then inspect again.
# Protected EEO fields remain blank unless `preferences.eeo` selects a decline
# option or you explicitly add the exact prompt and your reviewed answer here.
reviewed_answers: {}
