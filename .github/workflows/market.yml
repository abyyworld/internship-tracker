name: Market report

# Rebuilds the warehouse from git history and republishes docs/market.html
# once the daily watch has committed that day's tracker.csv. The warehouse
# itself is never committed: every run replays the history from scratch, so
# a change to the SQL models applies to every day already collected.
on:
  workflow_run:
    workflows: ["Daily internship and robotics watch"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-report
  cancel-in-progress: true

jobs:
  report:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          # every daily tracker.csv is a snapshot; a shallow clone has one
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-market.txt

      - name: Install the analysis stack
        run: python -m pip install -r requirements-market.txt

      - name: Test the warehouse models
        run: python -m unittest tests.test_market -v

      - name: Rebuild warehouse, analysis and report
        run: |
          python -m market.backfill
          python -m market.analysis
          python -m market.report

      - name: Commit the refreshed report
        run: |
          git config user.name "internship-watcher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market/results.json docs/market.html
          if git diff --cached --quiet; then
            echo "No market changes"
          else
            git commit -m "market: update $(date -u +%F)"
            git push
          fi
