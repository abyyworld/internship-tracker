name: Daily internship and robotics watch

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: internship-watcher
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install locked test dependencies
        run: python -m pip install --require-hashes -r requirements-ci.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

  watch:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Refresh public tracker
        run: |
          python internship_watcher.py
          python dashboard.py

      - name: Commit changed public data
        run: |
          git config user.name "internship-watcher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md tracker.csv manual_checks.md new_roles_*.md docs/index.html
          if git diff --cached --quiet; then
            echo "No tracker changes"
          else
            git commit -m "watcher: update $(date -u +%F)"
            git push
          fi
