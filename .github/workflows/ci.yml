name: Tests

# The watch workflow also runs these, but only once a day and only on main.
# A change deserves an answer when it is pushed, not the next morning.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install locked test dependencies
        run: python -m pip install --require-hashes -r requirements-ci.txt

      - name: Run the test suite
        run: python -m unittest discover -s tests -v

      - name: Check every module imports
        run: |
          python -c "import internship_watcher, dashboard, copilot, funding"
          python -c "import scorecard, source_health, universities, benchmark"
          python -c "import autoapply.cli"
